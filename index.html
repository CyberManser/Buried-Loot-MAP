<!-- PREVIEW WINDOWS -->
<div id="hoverPreview"></div>
<div id="hoverLabel"></div>


<!-- ============================= -->
<!--       JAVASCRIPT LOGIC        -->
<!-- ============================= -->

<script>

const zoomTarget = document.getElementById("zoomTarget");
const panzoom = Panzoom(zoomTarget, {
    maxScale: 6,
    minScale: 1,
    contain: 'outside'
});
zoomWrapper.addEventListener("wheel", panzoom.zoomWithWheel);


// ======================================================
// PREVIEW SYSTEM
// ======================================================
const previewBox = document.getElementById("hoverPreview");
const labelBox   = document.getElementById("hoverLabel");

let isMobile = window.innerWidth <= 768;


// ======================================================
// DESKTOP HOVER LOGIC
// ======================================================
if (!isMobile) {
    document.querySelectorAll(".point").forEach(point => {
        point.addEventListener("mousemove", (e) => {
            showPreview(point, e.clientX, e.clientY);
        });
        point.addEventListener("mouseleave", hidePreview);
    });
}


// ======================================================
// MOBILE TAP LOGIC (pointerdown = works everywhere)
// ======================================================
document.querySelectorAll(".point").forEach(point => {

    point.addEventListener("pointerdown", (e) => {
        e.stopPropagation();

        if (!isMobile) return;  // desktop uses hover

        // Center preview on mobile
        showPreview(
            point,
            window.innerWidth / 2,
            window.innerHeight / 2
        );
    });

});

// CLOSE PREVIEW WHEN TAP OUTSIDE
document.addEventListener("pointerdown", (e) => {
    if (!isMobile) return;
    if (!e.target.classList.contains("point")) hidePreview();
});


// ======================================================
// SHOW PREVIEW (AUTO SIZE TO GIF)
// ======================================================
function showPreview(point, x, y) {

    const imgSrc = point.dataset.image;
    const name = point.dataset.name;

    const tempImg = new Image();
    tempImg.src = imgSrc;

    tempImg.onload = function () {

        const imgW = tempImg.width;
        const imgH = tempImg.height;

        const maxW = window.innerWidth * 0.40;
        const maxH = window.innerHeight * 0.35;

        const scale = Math.min(maxW / imgW, maxH / imgH);
        const finalW = imgW * scale;
        const finalH = imgH * scale;

        previewBox.style.width = finalW + "px";
        previewBox.style.height = finalH + "px";
        previewBox.style.backgroundImage = `url(${imgSrc})`;

        previewBox.style.display = "block";
        labelBox.textContent = name;
        labelBox.style.display = "block";

        // MOBILE: let CSS place it
        if (isMobile) return;

        // DESKTOP
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        let left = x + 20;
        let top  = y + 20;

        if (left + finalW > screenW) left = x - finalW - 20;
        if (top + finalH > screenH)  top = y - finalH - 20;
        if (left < 10) left = 10;
        if (top < 10)  top = 10;

        previewBox.style.left = left + "px";
        previewBox.style.top  = top + "px";

        // LABEL
        let labelLeft = left + finalW / 2 - labelBox.offsetWidth / 2;
        let labelTop  = top + finalH + 10;

        if (labelLeft < 10) labelLeft = 10;
        if (labelLeft + labelBox.offsetWidth > screenW - 10)
            labelLeft = screenW - labelBox.offsetWidth - 10;

        if (labelTop + labelBox.offsetHeight > screenH - 10)
            labelTop = top - labelBox.offsetHeight - 10;

        labelBox.style.left = labelLeft + "px";
        labelBox.style.top  = labelTop + "px";
    }
}


// ======================================================
// HIDE PREVIEW
// ======================================================
function hidePreview() {
    previewBox.style.display = "none";
    labelBox.style.display = "none";
}

</script>
