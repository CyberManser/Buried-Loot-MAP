<!-- Preview Window -->
<div id="hoverPreview"></div>
<div id="hoverLabel"></div>

<script>
const previewBox = document.getElementById("hoverPreview");
const labelBox = document.getElementById("hoverLabel");

const previewWidth = 450;
const previewHeight = 300;
const pad = 12; // padding gap between dot and preview

document.querySelectorAll(".point").forEach(point => {

    point.addEventListener("mousemove", (e) => {

        const img = point.dataset.image;
        const name = point.dataset.name;

        // Show preview content
        previewBox.style.backgroundImage = `url(${img})`;
        previewBox.style.width = previewWidth + "px";
        previewBox.style.height = previewHeight + "px";
        previewBox.style.display = "block";

        // Show label content
        labelBox.textContent = name;
        labelBox.style.display = "block";

        // Mouse (dot) coordinates
        const dotX = e.clientX;
        const dotY = e.clientY;

        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        let x, y;

        // --------- HORIZONTAL ANCHORING WITH PADDING ---------
        if (dotX < screenW / 2) {
            // Dot on left → preview to the right
            x = dotX + pad;
        } else {
            // Dot on right → preview to the left
            x = dotX - previewWidth - pad;
        }

        // --------- VERTICAL ANCHORING WITH PADDING ---------
        if (dotY < screenH / 2) {
            // Dot on top → preview below
            y = dotY + pad;
        } else {
            // Dot on bottom → preview above
            y = dotY - previewHeight - pad;
        }

        // --------- SCREEN BOUNDARY PROTECTION ---------
        if (x < 10) x = 10;
        if (x + previewWidth > screenW - 10)
            x = screenW - previewWidth - 10;

        if (y < 10) y = 10;
        if (y + previewHeight > screenH - 10)
            y = screenH - previewHeight - 10;

        // Apply final preview position
        previewBox.style.left = x + "px";
        previewBox.style.top = y + "px";

        // --------- LABEL POSITIONING ---------
        const pRect = previewBox.getBoundingClientRect();

        // Center label under preview
        let labelLeft = pRect.left + (pRect.width / 2) - (labelBox.offsetWidth / 2);
        let labelTop = pRect.bottom + 10;

        // Keep label inside screen horizontally
        if (labelLeft < 10) labelLeft = 10;
        if (labelLeft + labelBox.offsetWidth > screenW - 10)
            labelLeft = screenW - labelBox.offsetWidth - 10;

        // If label goes off bottom → move it above preview
        if (labelTop + labelBox.offsetHeight > screenH - 10) {
            labelTop = pRect.top - labelBox.offsetHeight - 10;
        }

        // Apply label position
        labelBox.style.left = labelLeft + "px";
        labelBox.style.top = labelTop + "px";

    });

    point.addEventListener("mouseleave", () => {
        previewBox.style.display = "none";
        labelBox.style.display = "none";
    });
});
</script>
